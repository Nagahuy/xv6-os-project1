on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu qemu-system-riscv clang-format bc
      - run: clang-format --dry-run --Werror kernel/fcntl.h kernel/file.[ch] kernel/fs.[ch] kernel/param.h kernel/stat.h kernel/syscall.[ch] kernel/sysfile.c mkfs/mkfs.c user/user.h
      - run: make kernel/kernel fs.img
      - run: ./test-xv6.py -q usertests
      - run: QEMU_CACHE=writeback ./test-xv6.py crash

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install riscv64-elf-gcc
      - run: make kernel/kernel fs.img
